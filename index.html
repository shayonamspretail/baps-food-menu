<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAPS Minneapolis – Event Food Menu</title>
<meta name="description" content="Enter the food menu for BAPS Minneapolis mandir events.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍛</text></svg>">
<style>
  html,body{margin:0;height:100%;background:#f6f7fb;font-family:Arial,Helvetica,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#8B1E3F}
  #loading img{height:70px}
</style>
</head>
<body>
<div id="loading"><div style="font-size:40px">🍛</div><div>Loading events…</div></div>
<iframe id="app" title="BAPS Minneapolis Event Food Menu" allow="clipboard-write"></iframe>
<script>
  // ▼▼▼ Paste your Google Apps Script /exec link here ▼▼▼
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbw2l_jCY23Bart-a7vubbjX3Lr497nCqjEY3PQ2yTef43AjmM418AuKkwYoqV9AJeo/exec';
  // ▲▲▲ ------------------------------------------------ ▲▲▲

  // Pass ?event=… (from the sheet's 📝 Fill menu buttons) through to the menu page.
  var f = document.getElementById('app');
  f.addEventListener('load', function () { document.getElementById('loading').style.display = 'none'; });
  f.src = EXEC_URL + (location.search || '');
</script>
</body>
</html>
